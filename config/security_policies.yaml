version: "1.0"
max_limit: 1000
enforce_limit: true
allow_cartesian_joins: false

# Olist Brazilian E-Commerce Dataset — 8 whitelisted tables
whitelisted_tables:
  - orders
  - order_items
  - order_payments
  - order_reviews
  - customers
  - products
  - sellers
  - category_translation

allowed_statement_types:
  - Select
  - Union

forbidden_functions:
  - read_parquet
  - read_csv
  - read_json
  - read_blob
  - glob
  - httpfs
  - copy
  - install
  - load
  - shell
  - exec
  - pg_sleep
  - system$wait

sensitive_columns:
  - ssn
  - credit_card
  - password
  - secret
  - api_key
  - customer_unique_id
