name: cockpit

services:
  cockpit:
    build:
      context: .
      dockerfile: Dockerfile
    image: cockpit:latest
    container_name: cockpit
    restart: unless-stopped
    expose:
      - "8000"
    env_file: .env
    mem_limit: 2g
    cpus: 1.5
    networks:
      - reviews

networks:
  reviews:
    external: true
    name: reviews_default
